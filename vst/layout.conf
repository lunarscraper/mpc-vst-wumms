# Wumms MPC skin layout: 4 x 2 controls per tab at fixed positions, in the order of the Force's
# eight knobs (qlinks). r=48 and the grid are those of Rattler / carp 2000 (r=60 wandered on the
# device with the RAT). Frame titles empty: the tab name is already in the tab bar.
# MAIN is the whole unit on eight knobs; TONE holds the two filters and the gate, with DRIVE, MIX
# and LEVEL repeated so the tab can be played on its own. PRESET: the knob only browses the 32
# slots, LOAD and SAVE act.
# Palette: warm charcoal panel, cream print, amber accents.
style=td3
theme_bg=1c1a18
theme_panel=2b2825
theme_line=12110f
theme_ink=f4efe4
theme_ink_dim=b8b0a0
theme_ink_faint=6a6458
theme_accent=f2a23a
theme_accent_hi=ffc875
theme_knob_face=12110f
theme_knob_ring=000000
theme_bar=f2a23a
theme_seg_active=f2a23a
theme_seg_inactive=12110f
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=0e0d0c
theme_knob_off=58534a
theme_tab_on=f2a23a
theme_tab_on_tx=111111
theme_lcd=1a1206
theme_box=1f1d1a
theme_btn_bg=f4efe4
theme_chrome_ink=f4efe4
theme_go_on=f2a23a
theme_go_off=ffc875
theme_tabs=f2a23a

[tab MAIN]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="IN GAIN" key=gain
knob cx=490 cy=250 r=48 label="COMP" key=comp
knob cx=790 cy=250 r=48 label="ATTACK" key=attack
knob cx=1090 cy=250 r=48 label="RELEASE" key=release
knob cx=190 cy=530 r=48 label="DRIVE" key=drive
popup cx=490 cy=530 w=220 h=48 label="DISTO" key=disto
knob cx=790 cy=530 r=48 label="MIX" key=mix
knob cx=1090 cy=530 r=48 label="LEVEL" key=level
qlinks "MAIN" = gain,comp,attack,release,drive,disto,mix,level

[tab TONE]
frame x=36 y=88 w=1207 h=624 title=""
popup cx=190 cy=250 w=220 h=48 label="LO CUT" key=locut
knob cx=490 cy=250 r=48 label="HI CUT" key=hicut
popup cx=790 cy=250 w=220 h=48 label="GATE" key=gate
popup cx=1090 cy=250 w=220 h=48 label="DISTO" key=disto
knob cx=190 cy=530 r=48 label="DRIVE" key=drive
knob cx=490 cy=530 r=48 label="COMP" key=comp
knob cx=790 cy=530 r=48 label="MIX" key=mix
knob cx=1090 cy=530 r=48 label="LEVEL" key=level
qlinks "TONE" = locut,hicut,gate,disto,drive,comp,mix,level

[tab PRESET]
frame x=36 y=88 w=1207 h=624 title=""
button cx=340 cy=390 label="LOAD" key=load
knob cx=640 cy=380 r=48 label="PRESET" key=slot
button cx=940 cy=390 label="SAVE" key=save
qlinks "PRESET" = slot,load,save
