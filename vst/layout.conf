# Wumms skin, Force-Look (0.3.0, as Rattler 1.1, Fader FX 1.2 and V-Filter 0.7): large type, big touch targets, a
# colourful page of its own (gradient, glow, light rays, dark panels behind the controls), arc knobs, big option
# segments and buttons. force_look.py (vst.json "skin_post") repaints the generator's images and draws the
# #@title / #@frame / #@text lines (comments for the generator). Coordinates in shadow pixels (x 0-1280, y 86-714).
# Pages and Q-Links as before: MAIN is the whole unit on eight knobs; TONE holds the two filters and the gate, with
# DRIVE, COMP, MIX and LEVEL repeated so the tab can be played on its own. MASTER is the finishing stage (EQ, mono
# bass, width, limiter) with the loudness and gain-reduction readouts between the knob rows; its OFF | ON field is
# not on a Q-Link, so turning a knob can't switch it. PRESET: the knob only browses the 32 slots, LOAD and SAVE act.
# A knob with an odd radius has a bipolar arc (from 12 o'clock): LOW and HIGH.
# Colours: warm amber and gold on dark brown (each plugin its own colours).
style=plain
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.5
scale_names=1
theme_bg=4a2e08
theme_panel=4a2e08
theme_box=4a2e08
theme_ink=ffffff
theme_ink_dim=ffd88a
theme_accent=ffc23a
theme_accent_hi=ffffff
theme_lcd=1a1004
theme_ink_faint=4a2e08
#@look bg_top=1e1204 bg_bottom=4a2e08 glow=ff9a1a ray1=ffc23a ray2=c8641a ray_alpha=36 panel=140b02 frame=ffc23a frame_text=1e1204 title=ffffff sub=ffd88a text=fff6e2 knob_face=33200a knob_rim=8a6a2a knob_track=4a3210 knob_arc=ffc23a pointer=ffffff slider_track=4a3210 slider_fill=ffc23a slider_cap=ffffff slider_cap_line=33200a btn=6a4a12 btn_ring=ffc23a btn_text=ffffff btn_down=ffc23a btn_down_text=1e1204 seg=33200a seg_ring=8a6a2a seg_text=ffeac0 seg_on=ffc23a seg_on_ring=ffffff seg_on_text=1e1204 pill_off=33200a pill_on=ffc23a pill_dot=ffffff list=140b02 list_ring=ffc23a opt=33200a opt_text=fff6e2 opt_on=ffc23a opt_on_text=1e1204

[tab MAIN]
#@title text="MAIN" sub="WUMMS 0.3"
#@frame x=20 y=156 w=1240 h=270 title="DYNAMICS"
knob cx=175 cy=240 r=52 label="IN GAIN" key=gain
knob cx=485 cy=240 r=52 label="COMP" key=comp
knob cx=795 cy=240 r=52 label="ATTACK" key=attack
knob cx=1105 cy=240 r=52 label="RELEASE" key=release
#@frame x=20 y=438 w=1240 h=262 title="COLOUR / OUTPUT"
knob cx=175 cy=522 r=52 label="DRIVE" key=drive
popup cx=485 cy=522 w=280 h=68 label="" key=disto
#@text cx=485 cy=596 label="DISTO" size=29
knob cx=795 cy=522 r=52 label="MIX" key=mix
knob cx=1105 cy=522 r=52 label="LEVEL" key=level
qlinks "MAIN" = gain,comp,attack,release,drive,disto,mix,level

[tab TONE]
#@title text="TONE" sub="WUMMS 0.3"
#@frame x=20 y=156 w=1240 h=270 title="FILTER / GATE"
popup cx=175 cy=240 w=280 h=68 label="" key=locut
#@text cx=175 cy=314 label="LO CUT" size=29
knob cx=485 cy=240 r=52 label="HI CUT" key=hicut
popup cx=795 cy=240 w=280 h=68 label="" key=gate
#@text cx=795 cy=314 label="GATE" size=29
popup cx=1105 cy=240 w=280 h=68 label="" key=disto
#@text cx=1105 cy=314 label="DISTO" size=29
#@frame x=20 y=438 w=1240 h=262 title="AMOUNT"
knob cx=175 cy=522 r=52 label="DRIVE" key=drive
knob cx=485 cy=522 r=52 label="COMP" key=comp
knob cx=795 cy=522 r=52 label="MIX" key=mix
knob cx=1105 cy=522 r=52 label="LEVEL" key=level
qlinks "TONE" = locut,hicut,gate,disto,drive,comp,mix,level

[tab MASTER]
#@title text="MASTER" sub="WUMMS 0.3"
#@frame x=20 y=156 w=1240 h=232 title="EQ / STEREO"
knob cx=175 cy=230 r=47 label="LOW" key=m_low
knob cx=485 cy=230 r=47 label="HIGH" key=m_high
knob cx=795 cy=230 r=48 label="MONO BASS" key=m_mono
knob cx=1105 cy=230 r=48 label="WIDTH" key=m_width
#@frame x=20 y=400 w=1240 h=100 title="METER"
#@text cx=150 cy=455 label="LOUDNESS" size=26
readout cx=430 cy=455 w=300 h=52 label="" key=lufs
#@text cx=780 cy=455 label="LIMITER" size=26
readout cx=1060 cy=455 w=300 h=52 label="" key=gr
#@frame x=20 y=512 w=1240 h=198 title="LIMITER"
knob cx=175 cy=568 r=44 label="PUSH" key=m_push
knob cx=485 cy=568 r=44 label="CEILING" key=m_ceil
knob cx=795 cy=568 r=44 label="RELEASE" key=m_release
enum_h cx=1105 cy=568 label="" key=master sw=130 sh=64
#@text cx=1105 cy=640 label="MASTER" size=29
qlinks "MASTER" = m_low,m_high,m_mono,m_width,m_push,m_ceil,m_release

[tab PRESET]
#@title text="PRESET" sub="WUMMS 0.3"
#@frame x=20 y=156 w=1240 h=554 title="32 SLOTS"
button cx=240 cy=420 w=300 h=110 label="LOAD" key=load
knob cx=640 cy=410 r=52 label="PRESET" key=slot
button cx=1040 cy=420 w=300 h=110 label="SAVE" key=save
#@text cx=640 cy=230 label="REGLER WÄHLT DEN PLATZ · LOAD UND SAVE FÜHREN AUS" size=24 color=sub
qlinks "PRESET" = slot,load,save
