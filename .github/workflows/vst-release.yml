name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.3.0
        required: true
        default: 0.3.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  wumms:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@1af05b911e8580c8c2e473a1cc10119132e06eca
    permissions:
      contents: write
    with:
      tag: wumms-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 1af05b911e8580c8c2e473a1cc10119132e06eca
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: wumms
      license: MIT
      about: Wumms (insert effect) - end-of-chain warming unit in the manner of the OTO Boum - gate, one-knob compressor, low cut, four distortion types, high cut, dry/wet mix; switchable MASTER page (shelves, mono bass, width, true-peak limiter, LUFS and gain-reduction readouts); 32 preset slots with LOAD/SAVE.
      dry_run: ${{ inputs.dry_run }}
